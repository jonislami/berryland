<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="berryland Frozen Mushrooms pack (placeholder)">
  <defs>
    <linearGradient id="bagShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.82" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eeeae3"/>
    </linearGradient>
    <clipPath id="bag"><rect x="250" y="150" width="500" height="720" rx="10"/></clipPath>
  </defs>

  <!-- soft shadow under bag -->
  <ellipse cx="500" cy="882" rx="245" ry="26" fill="#000" opacity="0.10"/>

  <!-- bag -->
  <rect x="250" y="150" width="500" height="720" rx="10" fill="url(#bagShade)"/>
  <g clip-path="url(#bag)">
    <!-- top crimp seal lines -->
    <g stroke="#d9d3c8" stroke-width="3">
      <line x1="250" y1="168" x2="750" y2="168"/>
      <line x1="250" y1="180" x2="750" y2="180"/>
      <line x1="250" y1="192" x2="750" y2="192"/>
    </g>
    <!-- bottom crimp seal lines -->
    <g stroke="#d9d3c8" stroke-width="3">
      <line x1="250" y1="838" x2="750" y2="838"/>
      <line x1="250" y1="850" x2="750" y2="850"/>
      <line x1="250" y1="862" x2="750" y2="862"/>
    </g>

    <!-- botanical mushrooms, top-right -->
    <g transform="translate(560 210)">
      <!-- big mushroom -->
      <path d="M40 120 C40 60 190 60 190 120 C190 132 40 132 40 120 Z" fill="#8a5a3c"/>
      <path d="M40 120 C40 60 190 60 190 120 C190 132 40 132 40 120 Z" fill="#6f4529" opacity="0.35"/>
      <ellipse cx="90" cy="96" rx="16" ry="9" fill="#e9d9c6" opacity="0.8"/>
      <ellipse cx="140" cy="90" rx="12" ry="7" fill="#e9d9c6" opacity="0.8"/>
      <path d="M95 128 h40 v70 c0 14 -40 14 -40 0 Z" fill="#efe6d6"/>
      <path d="M95 128 h12 v70 c-4 4 -12 2 -12 -2 Z" fill="#d9c7ad"/>
      <!-- small mushroom -->
      <path d="M150 150 C150 118 235 118 235 150 C235 158 150 158 150 150 Z" fill="#9c6b45"/>
      <path d="M182 156 h22 v46 c0 9 -22 9 -22 0 Z" fill="#efe6d6"/>
      <!-- leaves -->
      <path d="M60 150 q-40 -6 -58 24 q40 10 58 -24 Z" fill="#5a8f3c"/>
      <path d="M70 168 q-30 10 -30 44 q30 -8 30 -44 Z" fill="#6fa64c"/>
    </g>

    <!-- Organicly Grown pill -->
    <g transform="translate(560 300)">
      <rect x="0" y="0" width="170" height="34" rx="17" fill="#2f9e44"/>
      <text x="85" y="23" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#ffffff">Organicly Grown</text>
    </g>

    <!-- Good source seal -->
    <g transform="translate(300 250)">
      <circle cx="55" cy="55" r="55" fill="#8a5a3c"/>
      <text x="55" y="46" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#fff">Good</text>
      <text x="55" y="64" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#fff">Source</text>
      <text x="55" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#fff">of Fiber</text>
    </g>

    <!-- Frozen -->
    <text x="300" y="470" font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#9a938a">Frozen</text>
    <!-- Mush- rooms -->
    <text x="296" y="560" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="118" fill="#8a5a3c" letter-spacing="-2">Mush-</text>
    <text x="296" y="668" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="118" fill="#8a5a3c" letter-spacing="-2">rooms</text>
    <!-- raised by sunlight -->
    <text x="300" y="712" font-family="Helvetica, Arial, sans-serif" font-size="32" letter-spacing="4" fill="#c8c1b6">RAISED BY SUNLIGHT</text>

    <!-- use line -->
    <text x="300" y="792" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="24" fill="#8a5a3c">Great for Cooking</text>
    <text x="300" y="820" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="24" fill="#8a5a3c">&amp; Sautéing</text>

    <!-- net + logo -->
    <text x="300" y="856" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9a938a">KEEP FROZEN · NET WT 16 OZ (1 LB) 454g</text>
    <g transform="translate(590 812)">
      <circle cx="26" cy="26" r="26" fill="#8fccea"/>
      <path d="M0 26 h52 v26 h-52 Z" fill="#8fccea"/>
      <rect x="0" y="26" width="52" height="26" fill="#49a64b"/>
      <g stroke="#fff" stroke-width="2"><line x1="26" y1="26" x2="4" y2="50"/><line x1="26" y1="26" x2="18" y2="52"/><line x1="26" y1="26" x2="34" y2="52"/><line x1="26" y1="26" x2="48" y2="50"/></g>
      <circle cx="16" cy="16" r="7" fill="#fff"/>
      <text x="64" y="44" font-family="Georgia, serif" font-weight="bold" font-size="34" fill="#17120f">berryland</text>
    </g>
  </g>
</svg>
